version: "3"

silent: true

vars:
  # Canonical mapping (workspace references/registry.md): reads resolve
  # opmodel.dev/* from GHCR; testing.opmodel.dev/* from the local registry.
  CANONICAL_REGISTRY: "opmodel.dev=ghcr.io/open-platform-model,testing.opmodel.dev=localhost:5000+insecure,registry.cue.works"
  CUE_CACHE_DIR: "{{.TASKFILE_DIR}}/../.cue-cache"
  # The commit of open-platform-model/enhancements that holds the enh tool; the
  # enh-ref default of the .github cite-lint.yml that ci.yml calls.
  CITE_LINT_REF: e0335b2ec44e659c0191bc3523d79d17f26f8e7d

env:
  CUE_REGISTRY: "{{.CANONICAL_REGISTRY}}"
  CUE_CACHE_DIR: "{{.CUE_CACHE_DIR}}"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  fmt:
    desc: Format all CUE modules
    cmds:
      - |
        for dir in "{{.TASKFILE_DIR}}"/*/; do
          [ -d "$dir/cue.mod" ] || continue
          echo "fmt: $(basename "$dir")"
          (cd "$dir" && cue fmt ./...)
        done

  vet:
    desc: Validate all CUE modules
    vars:
      CONCRETE: '{{.CONCRETE | default "false"}}'
      VET_FLAGS: '{{if eq .CONCRETE "true"}}-c{{end}}'
    cmds:
      - |
        for dir in "{{.TASKFILE_DIR}}"/*/; do
          [ -d "$dir/cue.mod" ] || continue
          echo "vet: $(basename "$dir")"
          (cd "$dir" && cue vet {{.VET_FLAGS}} ./...)
        done

  tidy:
    desc: Tidy all CUE module dependencies
    cmds:
      - |
        for dir in "{{.TASKFILE_DIR}}"/*/; do
          [ -d "$dir/cue.mod" ] || continue
          echo "tidy: $(basename "$dir")"
          (cd "$dir" && cue mod tidy)
        done

  # The shared check of the enhancements repo: a comment names an enhancement
  # by id only beside a reason in words, never by decision number. CI runs the
  # same rule through the cite-lint job (not part of `task check`, so the CI check job needs no Go) in .github/workflows/ci.yml, which
  # calls the reusable cite-lint.yml of the .github repo; that workflow holds
  # the tool commit as its enh-ref default. Keep CITE_LINT_REF equal to it
  # (compare at each .github pin move). No excludes, here or in the CI call;
  # an exclude added to one goes into the other with a reason.
  cite-lint:
    desc: Fail on a decision number or a lone enhancement id in a Go or CUE comment (enh cite-lint at the pinned commit; needs network and Go for go run)
    cmds:
      - go run github.com/open-platform-model/enhancements/tools/enh@{{.CITE_LINT_REF}} cite-lint --root "{{.TASKFILE_DIR}}"

  openspec:check:
    desc: Check that every active change declares its durable decisions and that each target file exists, and test that check
    cmds:
      - bash "{{.TASKFILE_DIR}}/.tasks/openspec-check.sh" "{{.TASKFILE_DIR}}"
      - bash "{{.TASKFILE_DIR}}/.tasks/openspec-check-test.sh"

  check:
    desc: Format and validate all CUE modules, check the durable decisions
    cmds:
      - task: fmt
      - task: vet
      - task: openspec:check
