version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Nothing here references the org .github repository yet. When something
      # does, it moves by the .github pin procedure only (.github README
      # "Pinning and bumps"); a Dependabot bump would move one reference alone.
      - dependency-name: "open-platform-model/.github*"
    commit-message:
      # ci touches no module directory, so it bumps no module.
      prefix: "ci"
