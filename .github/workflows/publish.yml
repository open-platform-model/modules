name: Publish Modules

on:
  push:
    branches: [v0_legacy]
    paths:
      - '**/*.cue'
      - 'versions.yml'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
    inputs:
      module:
        description: 'Module(s) to publish: a single name, a space-separated list, or "all"'
        required: false
        default: 'all'
        type: string
      dry_run:
        description: 'Validate only, skip publish and release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  # This branch (v0_legacy) is the frozen OPM v0 train: every module pins
  # CUE language.version v0.16.x and depends on the deprecated
  # opm/v1alpha1 + core/v1alpha1 catalog, whose schemas use the `div`
  # operator (removed in CUE v0.17). The OPM v1 / CUE v0.17 modules
  # publish from main with its own copy of this workflow.
  CUE_VERSION: 'v0.16.0'
  # Modules whose language.version doesn't match this prefix belong on the
  # other branch and fail the run.
  CUE_LANGUAGE_PREFIX: 'v0.16'
  CUE_REGISTRY: 'opmodel.dev=ghcr.io/open-platform-model,registry.cue.works'
  ORG: 'open-platform-model'
  REPO: 'modules'
  # The other train's branch. Both trains may publish the same registry
  # path (directory names differ, e.g. jellyfin_v016/ vs jellyfin/ both
  # publish opmodel.dev/modules/jellyfin), so their majors must differ.
  OTHER_BRANCH: 'main'

jobs:
  publish:
    name: Validate, Publish, Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install yq
        run: |
          set -euo pipefail
          sudo curl -fsSL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.53.2/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Install CUE toolchain
        run: |
          set -euo pipefail
          GOBIN="$HOME/cuebin" go install "cuelang.org/go/cmd/cue@${CUE_VERSION}"
          echo "cue: $("$HOME/cuebin/cue" version | head -1)"

      - name: Discover modules
        id: discover
        run: |
          set -euo pipefail
          MODULES=""
          for dir in */; do
            name="${dir%/}"
            [ -d "${name}/cue.mod" ] || continue
            lv=$(sed -n '/^language:/,/}/{s/.*version:[[:space:]]*"\([^"]*\)".*/\1/p;}' "${name}/cue.mod/module.cue" | head -1)
            case "$lv" in
              "${CUE_LANGUAGE_PREFIX}"*) : ;;
              *)
                echo "::error::${name}: language.version ${lv:-<missing>} does not match this branch's train (${CUE_LANGUAGE_PREFIX}.x). v0.17 modules belong on the main branch."
                exit 1
                ;;
            esac
            MODULES="${MODULES} ${name}"
          done
          MODULES="${MODULES# }"
          echo "modules=${MODULES}" >> "$GITHUB_OUTPUT"
          echo "Found modules: ${MODULES}"

      - name: Cross-train major separation guard
        run: |
          set -euo pipefail
          # A registry path present on both trains must use a different
          # major on each, so the trains never publish into each other's
          # version line (e.g. legacy jellyfin@v1 vs main jellyfin@v2).
          if ! git fetch -q origin "${OTHER_BRANCH}" 2>/dev/null; then
            echo "origin/${OTHER_BRANCH} not found — skipping cross-train check"
            exit 0
          fi
          path_and_major() { sed -n 's/^module:[[:space:]]*"\(.*\)@\(v[0-9][0-9]*\)".*/\1 \2/p' | head -1; }
          fail=0
          while read -r f; do
            other=$(git show "FETCH_HEAD:${f}" | path_and_major)
            [ -n "$other" ] || continue
            opath=${other% *}; omajor=${other#* }
            for dir in */; do
              name="${dir%/}"
              [ -f "${name}/cue.mod/module.cue" ] || continue
              local_pm=$(path_and_major < "${name}/cue.mod/module.cue")
              lpath=${local_pm% *}; lmajor=${local_pm#* }
              if [ "$lpath" = "$opath" ] && [ "$lmajor" = "$omajor" ]; then
                echo "::error::${name}: ${lpath}@${lmajor} is also published at ${omajor} from ${OTHER_BRANCH} (${f%/cue.mod/module.cue}/). Trains must be separated by major — bump this module's path major and version."
                fail=1
              fi
            done
          done < <(git ls-tree -r --name-only FETCH_HEAD | grep -E '^[^/]+/cue.mod/module.cue$')
          [ "$fail" -eq 0 ] || exit 1
          echo "No cross-train major collisions."

      - name: Detect unpublished versions
        id: check
        run: |
          set -euo pipefail

          ALL_MODULES="${{ steps.discover.outputs.modules }}"
          EVENT="${{ github.event_name }}"
          SELECTED="${{ inputs.module || 'all' }}"

          version_published() {
            local repo="$1" tag="$2"
            curl -fsS --head \
              -u "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.oci.image.manifest.v1+json,*/*" \
              "https://ghcr.io/v2/${ORG}/opmodel.dev/modules/${repo}/manifests/${tag}" \
              >/dev/null 2>&1
          }

          module_major_from_cue() {
            local name="$1"
            grep -E '^module:' "${name}/cue.mod/module.cue" \
              | head -1 \
              | sed -E 's/.*@(v[0-9]+).*/\1/'
          }

          # GHCR repo name = last segment of the module path, which can
          # differ from the directory name (jellyfin_v016/ publishes
          # opmodel.dev/modules/jellyfin).
          module_leaf_from_cue() {
            local name="$1"
            grep -E '^module:' "${name}/cue.mod/module.cue" \
              | head -1 \
              | sed -E 's|.*/([^/@"]+)@.*|\1|'
          }

          CHANGED=""
          for name in $ALL_MODULES; do
            # SELECTED may be "all", a single name, or a space-separated list.
            if [ "$EVENT" = "workflow_dispatch" ] && [ "$SELECTED" != "all" ]; then
              case " $SELECTED " in
                *" $name "*) : ;;   # explicitly selected — keep
                *) continue ;;      # not selected — skip
              esac
            fi

            version=$(yq ".${name}.version // \"\"" versions.yml)
            if [ -z "$version" ] || [ "$version" = "null" ]; then
              echo "  ${name}: no version in versions.yml — skip"
              continue
            fi

            path_major=$(module_major_from_cue "$name")
            ver_major="v${version#v}"; ver_major="${ver_major%%.*}"
            if [ "$path_major" != "$ver_major" ]; then
              echo "::error::${name}: module path major (${path_major}) != version major (${ver_major}). Bump module.cue path before publishing ${version}."
              exit 1
            fi

            if version_published "$(module_leaf_from_cue "$name")" "$version"; then
              echo "  ${name}@${version}: already on GHCR"
            else
              echo "  ${name}@${version}: unpublished"
              CHANGED="${CHANGED} ${name}"
            fi
          done
          CHANGED="${CHANGED# }"

          if [ -z "$CHANGED" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to publish."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "changed=${CHANGED}" >> "$GITHUB_OUTPUT"
            echo "Will publish: ${CHANGED}"
          fi

      - name: Check formatting
        if: steps.check.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          for name in ${{ steps.discover.outputs.modules }}; do
            (cd "$name" && "$HOME/cuebin/cue" fmt ./...)
          done
          if ! git diff --quiet; then
            echo "::error::CUE files are not formatted. Run 'cue fmt ./...' locally."
            git diff --name-only
            exit 1
          fi

      - name: Login to GHCR
        if: steps.check.outputs.has_changes == 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Validate and publish modules
        if: steps.check.outputs.has_changes == 'true'
        id: publish
        run: |
          set -euo pipefail

          DRY_RUN="${{ inputs.dry_run || 'false' }}"
          CHANGED="${{ steps.check.outputs.changed }}"
          PUBLISHED=""
          cuebin="$HOME/cuebin/cue"

          # Each module is validated/published independently so one failure
          # (e.g. a module whose catalog deps are not yet on GHCR) does not
          # abort the rest. Any failure is recorded and the job exits non-zero
          # at the end.
          FAILED=""
          for name in $CHANGED; do
            echo "=== ${name} ==="
            version=$(yq ".${name}.version" versions.yml)
            echo "  cue: $("$cuebin" version | head -1)"

            if ! (
              cd "$name"
              echo "  vet..."
              "$cuebin" vet ./...

              test_out=$("$cuebin" vet -t test ./... 2>&1) && echo "  test: pass" || {
                if echo "$test_out" | grep -q 'tag "test" not used in any file'; then
                  echo "  test: skip (no tests)"
                else
                  echo "$test_out" >&2
                  echo "  tests failed"
                  exit 1
                fi
              }

              if [ "$DRY_RUN" = "true" ]; then
                echo "  publish: skipped (dry run)"
                exit 0
              fi

              echo "  publish: ${name}@${version}..."
              "$cuebin" mod publish "${version}"
            ); then
              echo "::error::${name}: validate/publish failed"
              FAILED="${FAILED} ${name}"
              continue
            fi

            [ "$DRY_RUN" = "true" ] || PUBLISHED="${PUBLISHED} ${name}:${version}"
          done

          PUBLISHED="${PUBLISHED# }"
          echo "published=${PUBLISHED}" >> "$GITHUB_OUTPUT"

          if [ -n "$FAILED" ]; then
            echo "::error::Failed modules:${FAILED}"
            exit 1
          fi

      - name: Tag published modules
        if: steps.check.outputs.has_changes == 'true' && inputs.dry_run != true
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          head=$(git rev-parse HEAD)
          for entry in ${{ steps.publish.outputs.published }}; do
            name="${entry%%:*}"
            version="${entry##*:}"
            tag="modules/${name}/${version}"

            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              existing=$(git rev-parse "refs/tags/${tag}")
              if [ "$existing" != "$head" ]; then
                # A published version is immutable. The package was (re)published,
                # but the release tag must keep pointing at the commit that first
                # cut it — never move it, and never fail the release over it.
                echo "::warning::${tag} already exists at ${existing} (HEAD ${head}); keeping existing tag."
              else
                echo "  ${tag}: already at HEAD"
              fi
              continue
            fi

            git tag "${tag}"
            git push origin "refs/tags/${tag}"
            echo "  ${tag}: created"
          done

      - name: Pick release tag
        if: steps.check.outputs.has_changes == 'true' && inputs.dry_run != true
        id: release_tag
        run: |
          set -euo pipefail
          date="$(date -u +%Y-%m-%d)"
          # v0-legacy namespace — must never collide with main's release/<date> tags.
          base="release/v0-legacy/${date}"
          git fetch origin --tags --quiet

          if ! git rev-parse -q --verify "refs/tags/${base}" >/dev/null; then
            tag="${base}"
            title="${date} (v0 legacy)"
          else
            n=2
            while git rev-parse -q --verify "refs/tags/${base}.${n}" >/dev/null; do
              n=$((n+1))
            done
            tag="${base}.${n}"
            title="${date} (v0 legacy, rev ${n})"
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "title=${title}" >> "$GITHUB_OUTPUT"
          echo "date=${date}" >> "$GITHUB_OUTPUT"
          echo "Release: ${tag} — ${title}"

      - name: Build release notes
        if: steps.check.outputs.has_changes == 'true' && inputs.dry_run != true
        id: notes
        run: |
          set -euo pipefail

          CHANGED="${{ steps.check.outputs.changed }}"
          ALL="${{ steps.discover.outputs.modules }}"
          DATE="${{ steps.release_tag.outputs.date }}"

          is_changed() { echo " $CHANGED " | grep -q " $1 "; }

          # Only compare within the v0-legacy train — main's release/<date>
          # tags are a different module fleet.
          prev_release=$(git tag -l 'release/v0-legacy/*' --sort=-v:refname | grep -v "^${{ steps.release_tag.outputs.tag }}\$" | head -1 || true)

          {
            echo "## Modules — v0 legacy (${DATE})"
            echo
            if [ -n "$CHANGED" ]; then
              changed_bold=""
              for n in $CHANGED; do changed_bold="${changed_bold}, **${n}**"; done
              echo "Changed this release: ${changed_bold#, }"
            else
              echo "Changed this release: _none_"
            fi
            echo
            if [ -n "$prev_release" ]; then
              echo "[Compare to previous release](https://github.com/${ORG}/${REPO}/compare/${prev_release}...${{ steps.release_tag.outputs.tag }})"
              echo
            fi
            echo "| Module | Version | Package |"
            echo "| --- | --- | --- |"
            for name in $ALL; do
              version=$(yq ".${name}.version // \"\"" versions.yml)
              [ -z "$version" ] || [ "$version" = "null" ] && continue

              # GHCR package name comes from the module path leaf, which can
              # differ from the directory name (jellyfin_v016/ → jellyfin).
              leaf=$(grep -E '^module:' "${name}/cue.mod/module.cue" | head -1 | sed -E 's|.*/([^/@"]+)@.*|\1|')
              tag_url="https://github.com/${ORG}/${REPO}/releases/tag/modules/${name}/${version}"
              pkg_url="https://github.com/orgs/${ORG}/packages/container/package/opmodel.dev%2Fmodules%2F${leaf}"

              if is_changed "$name"; then
                echo "| **${name}** | **[${version}](${tag_url})** | [ghcr](${pkg_url}) |"
              else
                echo "| ${name} | [${version}](${tag_url}) _(unchanged)_ | [ghcr](${pkg_url}) |"
              fi
            done
          } > release-notes.md

          echo "path=release-notes.md" >> "$GITHUB_OUTPUT"
          echo "--- release notes ---"
          cat release-notes.md

      - name: Create GitHub Release
        if: steps.check.outputs.has_changes == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.release_tag.outputs.tag }}"
          title="${{ steps.release_tag.outputs.title }}"

          git tag "${tag}"
          git push origin "refs/tags/${tag}"

          # Legacy releases must never become the repo's "latest".
          gh release create "${tag}" \
            --title "${title}" \
            --notes-file "${{ steps.notes.outputs.path }}" \
            --latest=false
